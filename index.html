<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OficioAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      height: 100vh;
      height: 100dvh;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      background: #111827;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #263244;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .subtitulo {
      display: block;
      margin-top: 5px;
      color: #9ca3af;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
    }

    .mensaje {
      max-width: 85%;
      padding: 13px 16px;
      margin-bottom: 14px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .bot {
      background: #1f2937;
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    .usuario {
      background: #2563eb;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .funciones {
      padding: 12px;
      border-top: 1px solid #263244;
      border-bottom: 1px solid #263244;
    }

    .titulo-funciones {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .botones-funciones {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 3px;
    }

    .funcion {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid #374151;
      border-radius: 12px;
      background: #172033;
      color: white;
      font-size: 13px;
    }

    .funcion:active {
      transform: scale(0.97);
      background: #2563eb;
    }

    .zona-inferior {
      padding: 10px 12px 14px;
    }

    .entrada {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #374151;
      border-radius: 15px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #6b7280;
    }

    input:focus {
      border-color: #2563eb;
    }

    .enviar {
      padding: 0 18px;
      border: none;
      border-radius: 15px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .limpiar {
      display: block;
      margin: 0 auto 8px;
      padding: 6px 12px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: transparent;
      color: #9ca3af;
      font-size: 12px;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">OficioAI 🤖</div>
      <span class="subtitulo">Tu asistente inteligente para trabajos y oficios</span>
    </header>

    <div id="chat">

      <div class="mensaje bot">
        ¡Hola! 👋 Soy OficioAI.
        Elige un oficio o pregúntame directamente qué necesitas.
      </div>

    </div>

    <div class="funciones">

      <div class="titulo-funciones">
        🛠️ Trabajos y oficios
      </div>

      <div class="botones-funciones">

        <button class="funcion" onclick="seleccionar('Electricidad')">
          ⚡ Electricidad
        </button>

        <button class="funcion" onclick="seleccionar('Solar')">
          ☀️ Solar
        </button>

        <button class="funcion" onclick="seleccionar('Fontanería')">
          🚰 Fontanería
        </button>

        <button class="funcion" onclick="seleccionar('Albañilería')">
          🧱 Albañilería
        </button>

        <button class="funcion" onclick="seleccionar('Pintura')">
          🎨 Pintura
        </button>

        <button class="funcion" onclick="seleccionar('Climatización')">
          ❄️ Climatización
        </button>

        <button class="funcion" onclick="seleccionar('Mecánica')">
          🚗 Mecánica
        </button>

        <button class="funcion" onclick="seleccionar('Presupuestos')">
          📐 Presupuestos
        </button>

      </div>

    </div>

    <div class="zona-inferior">

      <button class="limpiar" onclick="limpiarChat()">
        Limpiar conversación
      </button>

      <div class="entrada">

        <input
          id="mensaje"
          type="text"
          placeholder="Escribe tu consulta..."
          autocomplete="off"
          onkeydown="if(event.key === 'Enter') enviar()"
        >

        <button
          id="boton"
          class="enviar"
          onclick="enviar()"
        >
          Enviar
        </button>

      </div>

    </div>

  </div>

  <script>

let oficioSeleccionado = "";

function seleccionar(oficio) {

  oficioSeleccionado = oficio;

  const chat = document.getElementById("chat");
  const input = document.getElementById("mensaje");

  const mensaje = document.createElement("div");
  mensaje.className = "mensaje bot";

  mensaje.textContent =
    "Has seleccionado " + oficio + ". 👷‍♂️\n\n" +
    "Cuéntame qué necesitas y te ayudaré con esta especialidad.";

  chat.appendChild(mensaje);

  input.placeholder = "Consulta sobre " + oficio + "...";
  input.focus();

  chat.scrollTop = chat.scrollHeight;
}

    async function enviar() {

      const input = document.getElementById("mensaje");
      const chat = document.getElementById("chat");
      const boton = document.getElementById("boton");

      const texto = input.value.trim();

      if (texto === "") return;

      const usuario = document.createElement("div");
      usuario.className = "mensaje usuario";
      usuario.textContent = texto;
      chat.appendChild(usuario);

      input.value = "";
      boton.disabled = true;

      const cargando = document.createElement("div");
      cargando.className = "mensaje bot";
      cargando.textContent = "Pensando...";
      chat.appendChild(cargando);

      chat.scrollTop = chat.scrollHeight;

      try {

        const respuesta = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
  mensaje: oficioSeleccionado
    ? "Especialidad: " + oficioSeleccionado + "\nConsulta: " + texto
    : texto
})
        });

        const datos = await respuesta.json();

        cargando.remove();

        const mensajeBot = document.createElement("div");
        mensajeBot.className = "mensaje bot";

        if (respuesta.ok) {
          mensajeBot.textContent = datos.respuesta;
        } else {
          mensajeBot.textContent =
            datos.error || "Ha ocurrido un error.";
        }

        chat.appendChild(mensajeBot);

      } catch (error) {

        cargando.remove();

        const mensajeError = document.createElement("div");
        mensajeError.className = "mensaje bot";
        mensajeError.textContent =
          "No se ha podido conectar con OficioAI.";

        chat.appendChild(mensajeError);
      }

      boton.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }

    function limpiarChat() {

      const chat = document.getElementById("chat");

      chat.innerHTML = `
        <div class="mensaje bot">
          ¡Hola! 👋 Soy OficioAI.
          Elige un oficio o pregúntame directamente qué necesitas.
        </div>
      `;

      document.getElementById("mensaje").focus();
    }

  </script>

</body>
</html>
