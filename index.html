<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OficioAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .mensaje {
      padding: 12px 15px;
      border-radius: 15px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .bot {
      background: #eeeeee;
      margin-right: auto;
    }

    .usuario {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .entrada {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      OficioAI 🤖
    </header>

    <div id="chat">
      <div class="mensaje bot">
        ¡Hola! 👋 Soy OficioAI. ¿En qué puedo ayudarte?
      </div>
    </div>

    <div class="entrada">
      <input
        id="mensaje"
        type="text"
        placeholder="Escribe un mensaje..."
        onkeydown="if(event.key === 'Enter') enviar()"
      >

      <button id="boton" onclick="enviar()">Enviar</button>
    </div>

  </div>

  <script>
    async function enviar() {
      const input = document.getElementById("mensaje");
      const chat = document.getElementById("chat");
      const boton = document.getElementById("boton");

      const texto = input.value.trim();

      if (texto === "") return;

      const usuario = document.createElement("div");
      usuario.className = "mensaje usuario";
      usuario.textContent = texto;
      chat.appendChild(usuario);

      input.value = "";
      boton.disabled = true;

      const cargando = document.createElement("div");
      cargando.className = "mensaje bot";
      cargando.textContent = "Pensando...";
      chat.appendChild(cargando);

      chat.scrollTop = chat.scrollHeight;

      try {
        const respuesta = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            mensaje: texto
          })
        });

        const datos = await respuesta.json();

        cargando.remove();

        const mensajeBot = document.createElement("div");
        mensajeBot.className = "mensaje bot";

        if (respuesta.ok) {
          mensajeBot.textContent = datos.respuesta;
        } else {
          mensajeBot.textContent =
            datos.error || "Ha ocurrido un error.";
        }

        chat.appendChild(mensajeBot);

      } catch (error) {
        cargando.remove();

        const mensajeError = document.createElement("div");
        mensajeError.className = "mensaje bot";
        mensajeError.textContent =
          "No se ha podido conectar con OficioAI.";

        chat.appendChild(mensajeError);
      }

      boton.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
