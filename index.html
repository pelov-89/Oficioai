<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OficioAI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0f19;color:white;height:100dvh}.app{width:100%;max-width:700px;height:100dvh;margin:auto;background:#111827;display:flex;flex-direction:column}header{padding:18px;text-align:center;border-bottom:1px solid #263244}.logo{font-size:24px;font-weight:bold}.subtitulo{display:block;margin-top:5px;color:#9ca3af;font-size:12px}#chat{flex:1;overflow-y:auto;padding:20px 16px;min-height:0}.mensaje{max-width:85%;padding:13px 16px;margin-bottom:14px;border-radius:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bot{background:#1f2937;margin-right:auto;border-bottom-left-radius:5px}.usuario{background:#2563eb;margin-left:auto;border-bottom-right-radius:5px}.mensaje img{display:block;width:100%;max-height:250px;object-fit:contain;border-radius:10px;margin-bottom:8px}.funciones{padding:12px;border-top:1px solid #263244;border-bottom:1px solid #263244}.titulo-funciones{font-size:13px;color:#9ca3af;margin-bottom:10px}.botones-funciones{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}.funcion{flex:0 0 auto;padding:9px 12px;border:1px solid #374151;border-radius:12px;background:#172033;color:white;font-size:13px}.funcion.activa{border-color:#60a5fa;background:#1e40af}.zona-inferior{padding:10px 12px 14px}.entrada{display:flex;gap:8px}input[type=text]{flex:1;min-width:0;padding:14px;border:1px solid #374151;border-radius:15px;background:#0f172a;color:white;font-size:16px;outline:none}input::placeholder{color:#6b7280}input:focus{border-color:#2563eb}.enviar{padding:0 13px;min-height:46px;border:0;border-radius:15px;background:#2563eb;color:white;font-weight:bold}.enviar:disabled{opacity:.5}.limpiar{display:block;margin:0 auto 8px;padding:6px 12px;border:1px solid #374151;border-radius:10px;background:transparent;color:#9ca3af;font-size:12px}.preview{display:flex;gap:10px;align-items:center;margin-bottom:8px;padding:8px;border:1px solid #374151;border-radius:12px}.preview img{height:70px;width:70px;object-fit:cover;border-radius:8px}.preview button{background:#374151;color:white;border:0;padding:10px;border-radius:10px}.estado{font-size:12px;color:#9ca3af;padding-bottom:5px}button:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">OficioAI 🤖</div><span class="subtitulo">Tu asistente inteligente para trabajos y oficios</span></header>
<div id="chat"><div class="mensaje bot">¡Hola! 👋 Soy OficioAI. Elige un oficio o pregúntame directamente qué necesitas. También puedes enviar una fotografía.</div></div>
<div class="funciones"><div class="titulo-funciones">🛠️ Trabajos y oficios</div><div class="botones-funciones">
<button class="funcion" onclick="seleccionar('Electricidad',this)">⚡ Electricidad</button>
<button class="funcion" onclick="seleccionar('Solar',this)">☀️ Solar</button>
<button class="funcion" onclick="seleccionar('Fontanería',this)">🚰 Fontanería</button>
<button class="funcion" onclick="seleccionar('Albañilería',this)">🧱 Albañilería</button>
<button class="funcion" onclick="seleccionar('Pintura',this)">🎨 Pintura</button>
<button class="funcion" onclick="seleccionar('Climatización',this)">❄️ Climatización</button>
<button class="funcion" onclick="seleccionar('Mecánica',this)">🚗 Mecánica</button>
<button class="funcion" onclick="seleccionar('Presupuestos',this)">📐 Presupuestos</button>
</div></div>
<div class="zona-inferior">
<button class="limpiar" onclick="limpiarChat()">Limpiar conversación</button>
<div id="preview" class="preview" hidden><img id="miniatura" alt="Fotografía seleccionada"><span>Foto preparada</span><button onclick="quitarFoto()">Quitar</button></div>
<div class="estado" id="estado" aria-live="polite"></div>
<div class="entrada">
<button class="enviar" id="microfono" onclick="escuchar()" aria-label="Dictar pregunta">🎙️</button>
<button class="enviar" onclick="document.getElementById('foto').click()" aria-label="Añadir fotografía">📷</button>
<input id="foto" type="file" accept="image/jpeg,image/png,image/webp,image/*" hidden>
<input id="mensaje" type="text" placeholder="Escribe tu consulta..." autocomplete="off" onkeydown="if(event.key==='Enter')enviar()">
<button id="boton" class="enviar" onclick="enviar()">Enviar</button>
</div></div></div>
<script>
let oficioSeleccionado='',imagenPendiente=null;
const chat=document.getElementById('chat');
function agregar(tipo,texto,imagen){const div=document.createElement('div');div.className='mensaje '+tipo;if(imagen){const img=document.createElement('img');img.src=imagen;img.alt='Fotografía enviada';div.appendChild(img)}const span=document.createElement('span');span.textContent=texto;div.appendChild(span);chat.appendChild(div);chat.scrollTop=chat.scrollHeight;return div}
function seleccionar(oficio,boton){oficioSeleccionado=oficio;document.querySelectorAll('.funcion').forEach(b=>b.classList.remove('activa'));boton.classList.add('activa');agregar('bot','Has seleccionado '+oficio+'. 👷‍♂️\n\nCuéntame qué necesitas y te ayudaré con esta especialidad.');const input=document.getElementById('mensaje');input.placeholder='Consulta sobre '+oficio+'...';input.focus()}
function hablar(texto){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const voz=new SpeechSynthesisUtterance(texto);voz.lang='es-ES';speechSynthesis.speak(voz)}
function escuchar(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('El reconocimiento de voz no está disponible en este navegador.');return}const reconocimiento=new SR();reconocimiento.lang='es-ES';reconocimiento.continuous=false;reconocimiento.interimResults=false;reconocimiento.onresult=e=>{const input=document.getElementById('mensaje');input.value=e.results[0][0].transcript;input.focus()};reconocimiento.onerror=()=>{document.getElementById('estado').textContent='No se ha podido activar el micrófono.'};try{reconocimiento.start()}catch(e){alert('No se pudo iniciar el micrófono.')}}
function quitarFoto(){imagenPendiente=null;document.getElementById('foto').value='';document.getElementById('preview').hidden=true;document.getElementById('miniatura').removeAttribute('src')}
document.getElementById('foto').addEventListener('change',async e=>{const archivo=e.target.files[0];if(!archivo)return;if(!archivo.type.startsWith('image/')){alert('Selecciona una imagen.');quitarFoto();return}if(archivo.size>10*1024*1024){alert('Elige una imagen de menos de 10 MB.');quitarFoto();return}try{const url=URL.createObjectURL(archivo);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const escala=Math.min(1,1280/Math.max(img.width,img.height));const lienzo=document.createElement('canvas');lienzo.width=Math.max(1,Math.round(img.width*escala));lienzo.height=Math.max(1,Math.round(img.height*escala));lienzo.getContext('2d').drawImage(img,0,0,lienzo.width,lienzo.height);imagenPendiente=lienzo.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);document.getElementById('miniatura').src=imagenPendiente;document.getElementById('preview').hidden=false}catch(err){quitarFoto();alert('No se ha podido preparar la fotografía.')}});
async function enviar(){const input=document.getElementById('mensaje'),boton=document.getElementById('boton'),estado=document.getElementById('estado');const texto=input.value.trim(),imagen=imagenPendiente;if((!texto&&!imagen)||boton.disabled)return;agregar('usuario',texto||'Analiza esta fotografía.',imagen);input.value='';quitarFoto();boton.disabled=true;estado.textContent='Analizando consulta...';const cargando=agregar('bot','Pensando...');try{const consulta=oficioSeleccionado?'Especialidad: '+oficioSeleccionado+'\nConsulta: '+(texto||'Analiza esta fotografía e indica qué se observa.'):(texto||'Analiza esta fotografía e indica qué se observa.');const respuesta=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensaje:consulta,imagen})});const datos=await respuesta.json();cargando.remove();if(respuesta.ok&&typeof datos.respuesta==='string'){agregar('bot',datos.respuesta);hablar(datos.respuesta);estado.textContent=''}else{agregar('bot',datos.error||'Ha ocurrido un error.');estado.textContent='No se pudo completar la consulta.'}}catch(err){cargando.remove();agregar('bot','No se ha podido conectar con OficioAI.');estado.textContent='Error de conexión.'}finally{boton.disabled=false;input.focus()}}
function limpiarChat(){window.speechSynthesis?.cancel();chat.innerHTML='';agregar('bot','¡Hola! 👋 Soy OficioAI. Elige un oficio o pregúntame directamente qué necesitas.');quitarFoto();document.getElementById('estado').textContent='';document.getElementById('mensaje').focus()}
</script>
</body>
</html>
