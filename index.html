<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OficioAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #111827;
    }

    header {
      padding: 18px 20px;
      text-align: center;
      background: #111827;
      border-bottom: 1px solid #263244;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .subtitulo {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: #9ca3af;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px;
    }

    .mensaje {
      max-width: 85%;
      padding: 13px 16px;
      margin-bottom: 14px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .bot {
      background: #1f2937;
      color: #f9fafb;
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    .usuario {
      background: #2563eb;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .zona-inferior {
      background: #111827;
      border-top: 1px solid #263244;
      padding: 10px 12px 14px;
    }

    .limpiar {
      display: block;
      margin: 0 auto 9px;
      padding: 6px 12px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: transparent;
      color: #9ca3af;
      font-size: 12px;
    }

    .entrada {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 15px;
      border: 1px solid #374151;
      border-radius: 15px;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #6b7280;
    }

    input:focus {
      border-color: #2563eb;
    }

    .enviar {
      padding: 0 18px;
      border: none;
      border-radius: 15px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .enviar:disabled {
      opacity: 0.5;
    }

    button:active {
      transform: scale(0.97);
    }

    .pie {
      text-align: center;
      margin-top: 8px;
      font-size: 10px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">OficioAI 🤖</div>
      <span class="subtitulo">Tu asistente inteligente</span>
    </header>

    <div id="chat">

      <div class="mensaje bot">
        ¡Hola! 👋 Soy OficioAI.
        ¿En qué puedo ayudarte?
      </div>

    </div>

    <div class="zona-inferior">

      <button class="limpiar" onclick="limpiarChat()">
        Limpiar conversación
      </button>

      <div class="entrada">

        <input
          id="mensaje"
          type="text"
          placeholder="Escribe tu mensaje..."
          autocomplete="off"
          onkeydown="if(event.key === 'Enter') enviar()"
        >

        <button
          id="boton"
          class="enviar"
          onclick="enviar()"
        >
          Enviar
        </button>

      </div>

      <div class="pie">
        OficioAI puede cometer errores. Comprueba la información importante.
      </div>

    </div>

  </div>

  <script>
    async function enviar() {

      const input = document.getElementById("mensaje");
      const chat = document.getElementById("chat");
      const boton = document.getElementById("boton");

      const texto = input.value.trim();

      if (texto === "") return;

      const usuario = document.createElement("div");
      usuario.className = "mensaje usuario";
      usuario.textContent = texto;
      chat.appendChild(usuario);

      input.value = "";
      boton.disabled = true;

      const cargando = document.createElement("div");
      cargando.className = "mensaje bot";
      cargando.textContent = "Pensando...";
      chat.appendChild(cargando);

      chat.scrollTop = chat.scrollHeight;

      try {

        const respuesta = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            mensaje: texto
          })
        });

        const datos = await respuesta.json();

        cargando.remove();

        const mensajeBot = document.createElement("div");
        mensajeBot.className = "mensaje bot";

        if (respuesta.ok) {
          mensajeBot.textContent = datos.respuesta;
        } else {
          mensajeBot.textContent =
            datos.error || "Ha ocurrido un error.";
        }

        chat.appendChild(mensajeBot);

      } catch (error) {

        cargando.remove();

        const mensajeError = document.createElement("div");
        mensajeError.className = "mensaje bot";

        mensajeError.textContent =
          "No se ha podido conectar con OficioAI.";

        chat.appendChild(mensajeError);
      }

      boton.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }

    function limpiarChat() {

      const chat = document.getElementById("chat");

      chat.innerHTML = `
        <div class="mensaje bot">
          ¡Hola! 👋 Soy OficioAI.
          ¿En qué puedo ayudarte?
        </div>
      `;

      document.getElementById("mensaje").focus();
    }
  </script>

</body>
</html>
