<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .mensaje {
      padding: 12px 15px;
      border-radius: 15px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.4;
    }

    .bot {
      background: #eeeeee;
      margin-right: auto;
    }

    .usuario {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .entrada {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      Mi IA 🤖
    </header>

    <div id="chat">
      <div class="mensaje bot">
        ¡Hola! 👋 Soy tu asistente. ¿En qué puedo ayudarte?
      </div>
    </div>

    <div class="entrada">
      <input
        id="mensaje"
        type="text"
        placeholder="Escribe un mensaje..."
        onkeydown="if(event.key === 'Enter') enviar()"
      >

      <button onclick="enviar()">Enviar</button>
    </div>

  </div>

  <script>
    function enviar() {
      const input = document.getElementById("mensaje");
      const chat = document.getElementById("chat");

      const texto = input.value.trim();

      if (texto === "") return;

      const usuario = document.createElement("div");
      usuario.className = "mensaje usuario";
      usuario.textContent = texto;

      chat.appendChild(usuario);

      input.value = "";

      const respuesta = document.createElement("div");
      respuesta.className = "mensaje bot";
      respuesta.textContent =
        "He recibido tu mensaje 👍. Pronto podremos conectar la inteligencia artificial de verdad.";

      chat.appendChild(respuesta);

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
