<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OficioAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .app {
      max-width: 650px;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.08);
    }

    header {
      padding: 16px 20px;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .subtitulo {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: normal;
      opacity: 0.7;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .mensaje {
      padding: 12px 15px;
      border-radius: 18px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: aparecer 0.2s ease;
    }

    .bot {
      background: #f0f1f3;
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    .usuario {
      background: #111827;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .entrada {
      display: flex;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      gap: 8px;
      background: white;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .limpiar {
      margin: 0 12px 8px auto;
      padding: 7px 11px;
      font-size: 12px;
      background: #e5e7eb;
      color: #374151;
      font-weight: normal;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      OficioAI 🤖
      <span class="subtitulo">Tu asistente inteligente</span>
    </header>

    <div id="chat">
      <div class="mensaje bot">
        ¡Hola! 👋 Soy OficioAI. ¿En qué puedo ayudarte?
      </div>
    </div>

    <button class="limpiar" onclick="limpiarChat()">
      Limpiar conversación
    </button>

    <div class="entrada">
      <input
        id="mensaje"
        type="text"
        placeholder="Escribe un mensaje..."
        autocomplete="off"
        onkeydown="if(event.key === 'Enter') enviar()"
      >

      <button id="boton" onclick="enviar()">Enviar</button>
    </div>

  </div>

  <script>
    async function enviar() {
      const input = document.getElementById("mensaje");
      const chat = document.getElementById("chat");
      const boton = document.getElementById("boton");

      const texto = input.value.trim();

      if (texto === "") return;

      const usuario = document.createElement("div");
      usuario.className = "mensaje usuario";
      usuario.textContent = texto;
      chat.appendChild(usuario);

      input.value = "";
      boton.disabled = true;

      const cargando = document.createElement("div");
      cargando.className = "mensaje bot";
      cargando.textContent = "Pensando...";
      chat.appendChild(cargando);

      chat.scrollTop = chat.scrollHeight;

      try {
        const respuesta = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            mensaje: texto
          })
        });

        const datos = await respuesta.json();

        cargando.remove();

        const mensajeBot = document.createElement("div");
        mensajeBot.className = "mensaje bot";

        if (respuesta.ok) {
          mensajeBot.textContent = datos.respuesta;
        } else {
          mensajeBot.textContent =
            datos.error || "Ha ocurrido un error.";
        }

        chat.appendChild(mensajeBot);

      } catch (error) {
        cargando.remove();

        const mensajeError = document.createElement("div");
        mensajeError.className = "mensaje bot";
        mensajeError.textContent =
          "No se ha podido conectar con OficioAI.";

        chat.appendChild(mensajeError);
      }

      boton.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }

    function limpiarChat() {
      const chat = document.getElementById("chat");

      chat.innerHTML = `
        <div class="mensaje bot">
          ¡Hola! 👋 Soy OficioAI. ¿En qué puedo ayudarte?
        </div>
      `;

      document.getElementById("mensaje").focus();
    }
  </script>

</body>
</html>
